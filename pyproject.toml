[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tools/radar.py" = ["E501"]
"tools/write_stories.py" = ["E501"]
"tools/build_newsletter.py" = ["E501"]
"tools/push_newsletter.py" = ["E501"]
