name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tools tests
      - run: pytest -q
        env:
          SECRET_KEY: ci
          ADMIN_PASSWORD: ci-password
          FLASK_ENV: development
