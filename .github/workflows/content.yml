name: Content pipeline
on:
  schedule:
    - cron: "0 0 * * *"    # 08:00 Beijing (00:00 UTC, 20:00 ET the evening before) — 5 stories as drafts for review
  workflow_dispatch:
    inputs:
      count:
        description: "Stories to write"
        default: "3"
      status:
        description: "draft or published"
        default: "draft"
      mode:
        description: "write (new stories) or fix-drafts (revise existing drafts per editor notes)"
        default: "write"
concurrency:
  group: content-pipeline
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://patriotdailyalerts.com' }}
      STORY_AUTHOR: ${{ vars.STORY_AUTHOR || 'Joseph Sosa' }}   # byline on pipeline stories; override in repo Variables
      STORY_EFFORT: ${{ vars.STORY_EFFORT || 'medium' }}
      STORY_MODEL: ${{ vars.STORY_MODEL || 'claude-opus-5' }}
      RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || vars.STORY_MODEL || 'claude-opus-5' }}
      EDITOR_MODEL: ${{ vars.EDITOR_MODEL || vars.STORY_MODEL || 'claude-opus-5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-content.txt
      - name: Topic radar
        run: python tools/radar.py --days 2 --print
      - name: Write stories
        run: |
          if [ "${{ github.event.inputs.mode }}" = "fix-drafts" ]; then python tools/write_stories.py --fix-drafts --status "${{ github.event.inputs.status }}"; exit 0; fi
          if [ -n "${{ github.event.inputs.count }}" ]; then COUNT="${{ github.event.inputs.count }}"; STATUS="${{ github.event.inputs.status }}";
          else COUNT=5; STATUS=draft; fi
          python tools/write_stories.py --count "$COUNT" --status "$STATUS"
      - name: Commit images and radar memory
        run: |
          git config user.name "content-bot"
          git config user.email "news@patriotdailyalerts.com"
          # another run may have pushed meanwhile: rebuild on top of origin/main and union-merge the dedupe memory
          cp content/radar/used.json /tmp/used.local.json
          git fetch origin main
          git checkout -- content/radar/used.json
          git checkout -B main origin/main
          python - <<'PY'
          import json
          a = json.load(open("content/radar/used.json")); b = json.load(open("/tmp/used.local.json"))
          for k in ("urls", "titles"):
              a[k] = list(dict.fromkeys(a.get(k, []) + b.get(k, [])))
          json.dump(a, open("content/radar/used.json", "w"), indent=1)
          PY
          git add src/static/uploads content/radar/used.json
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "Content pipeline: images for $(date -u +%F)" && git push origin main)
