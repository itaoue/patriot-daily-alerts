name: Newsletter
on:
  schedule:
    - cron: "7 2 * * *"    # 10:07 Beijing (02:07 UTC; off the top of the hour) — one daily issue, two hours after the story batch; BigMailer draft
  workflow_dispatch:
    inputs:
      edition:
        description: "daily, am or pm (blank = daily)"
        default: ""
      ready:
        description: "true = mark the BigMailer campaign ready to send; false = leave as draft"
        default: "false"
      push:
        description: "false = build only (preview the subject line in the log), no BigMailer campaign"
        default: "true"
      date:
        description: "issue date YYYY-MM-DD (blank = today, ET)"
        default: ""
concurrency:
  group: newsletter
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://patriotdailyalerts.com' }}
      BIGMAILER_API_KEY: ${{ secrets.BIGMAILER_API_KEY }}
      BIGMAILER_BRAND_ID: ${{ secrets.BIGMAILER_BRAND_ID }}
      BIGMAILER_LIST_ID: ${{ secrets.BIGMAILER_LIST_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # for the daily poll question
      EDITOR_MODEL: ${{ vars.EDITOR_MODEL || 'claude-sonnet-5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-content.txt
      - name: Build issue
        id: build
        run: |
          set -o pipefail
          ED="${{ github.event.inputs.edition }}"; DT="${{ github.event.inputs.date }}"
          SKIP=""; [ "${{ github.event_name }}" = "schedule" ] && SKIP="--skip-if-exists"   # a manual build earlier the same day wins
          python tools/build_newsletter.py ${ED:+--edition $ED} ${DT:+--date $DT} $SKIP | tee build.log
          if grep -q "already built" build.log; then echo "skip=true" >> "$GITHUB_OUTPUT"; else
          echo "campaign=$(ls -t dist/newsletters/*.json | head -1 | xargs -n1 basename | sed 's/.json$//')" >> "$GITHUB_OUTPUT"; fi
      - name: Publish "View online" copy
        if: steps.build.outputs.skip != 'true'
        run: |
          git config user.name "content-bot"
          git config user.email "news@patriotdailyalerts.com"
          git add src/static/newsletters
          git diff --cached --quiet || (git commit -m "Newsletter ${{ steps.build.outputs.campaign }}" && git pull --rebase origin main && git push)
      - name: Push to BigMailer
        if: env.BIGMAILER_API_KEY != '' && github.event.inputs.push != 'false' && steps.build.outputs.skip != 'true'
        run: |
          READY="${{ github.event.inputs.ready }}"
          python tools/push_newsletter.py "${{ steps.build.outputs.campaign }}" $([ "$READY" = "true" ] && echo --ready)
