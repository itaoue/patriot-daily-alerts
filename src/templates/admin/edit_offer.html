{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if offer.id else 'New' }} offer{% endblock %}
{% block content %}
<div class="ah-row"><h1>{{ offer.name if offer.id else 'New offer' }}</h1>{% if offer.id %}<a href="{{ url_for('public.offer_click', offer_id=offer.id) }}" target="_blank">Test link ↗</a>{% endif %}</div>
<form method="post" class="editor editor--single">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Internal name <input name="name" value="{{ offer.name or '' }}" placeholder="e.g. Gold IRA kit — CPL network A"></label>
  <label>Headline <input name="headline" value="{{ offer.headline or '' }}" required maxlength="200"></label>
  <label>Short blurb (optional) <input name="blurb" value="{{ offer.blurb or '' }}" maxlength="300"></label>
  <label>Destination URL (use {subid} for the click id) <input name="url" value="{{ offer.url or '' }}" required placeholder="https://network.example/click?aff=123&sub1={subid}"></label>
  <label>Image URL (optional, 4:3) <input name="image_url" value="{{ offer.image_url or '' }}"></label>
  <label>Label <input name="label" value="{{ offer.label or 'Sponsored' }}" maxlength="40"></label>
  <label>Button text <input name="cta" value="{{ offer.cta or 'Learn more' }}" maxlength="40"></label>
  <label>Who sees it (answer to the post-vote savings question)
    <select name="audience">{% for key, label in audiences.items() %}<option value="{{ key }}" {{ 'selected' if (offer.audience or 'all') == key }}>{{ label }}</option>{% endfor %}</select>
  </label>
  <label>Weight (higher shows first) <input name="weight" type="number" value="{{ offer.weight or 0 }}"></label>
  <label><input type="checkbox" name="active" value="1" {{ 'checked' if offer.active }}> Active</label>
  <button class="btn">Save</button>
</form>
{% if offer.id %}
<form method="post" style="margin-top:24px" onsubmit="return confirm('Delete this offer and its click log?')">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="delete">
  <button class="btn btn--ghost">Delete offer</button>
</form>
{% endif %}
{% endblock %}
