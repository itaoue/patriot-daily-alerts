<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Comment {{ action }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=2"></head>
<body class="login">
<div class="login__box">
  <h1>{{ 'Approved ✓' if action == 'approved' else 'Marked as spam' }}</h1>
  <p><b>{{ comment.name }}</b> on <a href="{{ comment.post.url }}#comments">{{ comment.post.title }}</a>:</p>
  <p style="white-space:pre-wrap;color:#555">{{ comment.body }}</p>
  <p><a href="{{ url_for('admin.comments') }}">Open the review queue</a></p>
</div>
</body></html>
