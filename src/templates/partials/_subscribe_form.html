<form class="subscribe-form" action="{{ url_for('api.subscribe') }}" method="post" data-subscribe>
  <input type="text" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
  <input type="hidden" name="source" value="{{ source or 'site' }}">
  <label class="sr-only" for="sub-email-{{ source or 'site' }}">Email address</label>
  <input id="sub-email-{{ source or 'site' }}" type="email" name="email" placeholder="Email Address" required>
  <button class="subscribe-form__btn" type="submit">Subscribe</button>
  <p class="subscribe-form__msg" role="status" aria-live="polite"></p>
</form>
