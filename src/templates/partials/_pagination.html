{% if pagination and pagination.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if pagination.has_prev %}<a class="btn btn--ghost" href="{{ base_url }}{{ '&' if '?' in base_url else '?' }}page={{ pagination.prev_num }}">← Newer</a>{% else %}<span></span>{% endif %}
  <span class="pagination__info">Page {{ pagination.page }} of {{ pagination.pages }}</span>
  {% if pagination.has_next %}<a class="btn btn--ghost" href="{{ base_url }}{{ '&' if '?' in base_url else '?' }}page={{ pagination.next_num }}">Older →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
